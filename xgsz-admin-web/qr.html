<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>扫码登录确认 · 芯光数智</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;
    color:#E7EEF8;
    background:
      radial-gradient(900px 500px at 15% 0%,rgba(37,99,235,.35),rgba(37,99,235,0) 60%),
      radial-gradient(700px 420px at 90% 100%,rgba(14,165,233,.22),rgba(14,165,233,0) 60%),
      linear-gradient(160deg,#0B1220 0%,#101B30 55%,#0C1626 100%);
  }
  .card{width:100%;max-width:400px;background:rgba(19,31,51,.92);border:1px solid #2A3B57;border-radius:18px;padding:26px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand img{width:34px;height:34px;border-radius:9px}
  .brand b{font-size:1rem;letter-spacing:1px}
  .brand span{font-size:0.6875rem;color:#7F98B8;margin-left:auto}
  h1{margin:0 0 6px;font-size:1.25rem;letter-spacing:1px}
  .sub{margin:0 0 18px;font-size:0.78125rem;color:#8FB2D6;line-height:1.7}
  label{display:block;font-size:0.78125rem;color:#A8C4DE;margin:13px 0 6px}
  input{width:100%;height:46px;border:1px solid #2D4063;border-radius:10px;background:rgba(8,15,27,.65);color:#E7EEF8;padding:0 13px;font-size:0.9375rem;outline:none;transition:.15s}
  input:focus{border-color:#3B82F6;box-shadow:0 0 0 3px rgba(59,130,246,.18)}
  input::placeholder{color:#56708F}
  .btn{width:100%;margin-top:20px;height:48px;border:none;border-radius:10px;background:#1677FF;color:#fff;font-size:0.96875rem;font-weight:600;letter-spacing:1px;cursor:pointer;transition:.15s}
  .btn:hover{background:#3B8CFF}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .msg{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;font-size:0.78125rem;line-height:1.7}
  .msg.err{background:rgba(229,72,77,.14);border:1px solid rgba(229,72,77,.4);color:#FFB4B6}
  .msg.ok{background:rgba(18,161,80,.14);border:1px solid rgba(18,161,80,.4);color:#8FE3B4}
  .hint{margin-top:18px;padding-top:14px;border-top:1px solid #23334C;font-size:0.6875rem;color:#6E88A8;line-height:1.8}
  .success{text-align:center;padding:10px 0 4px;display:none}
  .success .ic{width:62px;height:62px;border-radius:50%;margin:0 auto 14px;background:rgba(18,161,80,.16);border:1px solid rgba(18,161,80,.45);display:flex;align-items:center;justify-content:center;font-size:1.75rem;color:#4ADE80}
  .success h2{margin:0 0 8px;font-size:1.125rem;color:#EAF1FA}
  .success p{margin:0;font-size:0.8125rem;color:#9FB6D2;line-height:1.8}
  .back{display:inline-block;margin-top:18px;color:#8AB4FF;font-size:0.78125rem;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="logo-icon.png" alt="芯光数智">
    <b>芯光数智</b>
    <span>扫码登录确认</span>
  </div>
  <div id="formWrap">
    <h1>确认登录</h1>
    <p class="sub">你正在用手机确认一台电脑的扫码登录。请输入你的平台账号密码，确认后电脑端将以你的身份进入平台。</p>
    <form id="form">
      <label>账号</label>
      <input id="username" autocomplete="username" placeholder="用户名" required>
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="密码" required>
      <button class="btn" id="submitBtn" type="submit">确认登录</button>
    </form>
    <div id="msg" class="msg"></div>
    <div class="hint">请只在你自己操作的电脑上确认；确认后电脑端可直接进入平台。</div>
  </div>
  <div id="success" class="success">
    <div class="ic">✓</div>
    <h2>已确认登录</h2>
    <p id="successText">请回到电脑端，页面会自动进入平台。</p>
    <a class="back" href="/">返回登录页</a>
  </div>
</div>
<script>
(function(){
  var ticket = new URLSearchParams(location.search).get('t') || '';
  var formWrap = document.getElementById('formWrap');
  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submitBtn');
  function showMsg(text, cls){
    msg.className = 'msg ' + (cls || 'err');
    msg.textContent = text;
    msg.style.display = 'block';
  }
  if(!ticket){
    formWrap.innerHTML = '<div class="msg err" style="display:block">二维码无效：缺少登录票据。请回到电脑端刷新二维码后重新扫描。</div>';
    return;
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var username = (document.getElementById('username').value || '').trim();
    var password = document.getElementById('password').value || '';
    if(!username || !password){ showMsg('请输入账号和密码'); return; }
    btn.disabled = true; btn.textContent = '确认中…';
    msg.style.display = 'none';
    fetch('/api/account/v1/user/qr/approve', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ticket: ticket, username: username, password: password})
    }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.errcode === 0){
        formWrap.style.display = 'none';
        document.getElementById('success').style.display = 'block';
        document.getElementById('successText').textContent = '电脑端已确认登录' + (j.data && j.data.name ? '：' + j.data.name : '') + '。请回到电脑端。';
      }else{
        showMsg((j && j.errmsg) || '确认失败，请重试');
        btn.disabled = false; btn.textContent = '确认登录';
      }
    }).catch(function(e){
      showMsg('网络异常：' + (e && e.message ? e.message : '请稍后重试'));
      btn.disabled = false; btn.textContent = '确认登录';
    });
  });
})();
</script>
</body>
</html>
