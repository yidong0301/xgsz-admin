x-backend-env: &backend-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: root
  DB_PASS: root123456
  DB_TABLE: xgsz_admin
  CACHES_REDIS_HOST: redis
  CACHES_REDIS_PORT: "6379"
  CACHES_REDIS_DB: "8"
  CACHES_REDIS_PASS: ""
  CELERY_BROKER_REDIS_HOST: redis
  CELERY_BROKER_REDIS_PORT: "6379"
  CELERY_BROKER_REDIS_DB: "4"
  CELERY_BROKER_REDIS_PASS: ""
  CELERY_BACKEND_REDIS_HOST: redis
  CELERY_BACKEND_REDIS_PORT: "6379"
  CELERY_BACKEND_REDIS_DB: "5"
  CELERY_BACKEND_REDIS_PASS: ""
  MONGO_HOST: mongo
  MONGO_PORT: "27017"
  CHANNELS_REDIS_URL: redis://redis:6379/0
  KUBECONFIG_DIR: /root/.kube/clusters
  K8S_EXPECTED_CLUSTERS_COUNT: "8"
  DEBUG: "True"
  ALLOWED_HOSTS: "*"

services:
  mysql:
    image: mysql:5.7
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: xgsz_admin
    ports:
      - "127.0.0.1:3307:3306"   # 仅本机访问，不暴露公网
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:6-alpine
    ports:
      - "127.0.0.1:6380:6379"   # 主机 6380（避开本机 Memurai 的 6379），容器内仍是 6379

  mongo:
    image: mongo:4.4
    ports:
      - "127.0.0.1:27017:27017"  # 仅本机访问，不暴露公网
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./xgsz-admin
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - mongo
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kube/config:/root/.kube/config:ro
      - ./kube/clusters:/root/.kube/clusters:ro
    networks:
      - default
      - kind

  celery-worker:
    build: ./xgsz-admin
    command: celery -A xgsz_admin worker --pool=solo -l INFO
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kube/config:/root/.kube/config:ro
      - ./kube/clusters:/root/.kube/clusters:ro
    networks:
      - default
      - kind

  celery-beat:
    build: ./xgsz-admin
    command: celery -A xgsz_admin beat -l info
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kube/config:/root/.kube/config:ro
      - ./kube/clusters:/root/.kube/clusters:ro
    networks:
      - default
      - kind

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./xgsz-admin-web:/usr/share/nginx/html:ro
      - ./nginx/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql-data:
  mongo-data:

networks:
  kind:
    external: true
